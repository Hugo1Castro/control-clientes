<section id="actions" class="py-4 mb-4"> 
    <div class="container"> 
        <div class="row"> 
            <div class="col-md-3">
                <a href="#" class="btn btn-primary w-100"  
                    data-bs-toggle="modal"  
                    data-bs-target="#agregarClienteModal"> 
                    <i class="bi bi-plus-circle"></i> Agregar Cliente 
                </a> 
            </div> 
        </div> 
    </div> 
</section> 
 
<!-- Listado Clientes --> 
<section id="clientes"> 
    <div class="container"> 
        <div class="row"> 
            <div class="col-md-9"> 
                <div class="card"> 
                    <div class="card-header"> 
                        <h4>Listado de Clientes</h4> 
                    </div> 
                    <table class="table table-striped"> 
                        <thead class="table-dark"> 
                            <tr> 
                                <th>Nombre</th> 
                                <th>Saldo</th> 
                            </tr> 
                        </thead> 
                        <tbody> 
                            <!-- Iteración sobre la lista de clientes --> 
                            @for (cliente of clientes; track cliente) { 
                            <tr> 
                                <td>{{cliente.nombre}} {{cliente.apellido}}</td> 
                                <td>{{cliente.saldo | currency: 'MNX':'$'}}</td>
                                 <td> 
                                    <a routerLink="/cliente/editar/{{cliente.id}}"  
                                        class="btn btn-secondary"> 
                                        <i class="bi bi-pencil-square"></i> Editar 
                                    </a> 
                                </td>  
                            </tr> 
                            } 
                        </tbody> 
                    </table> 
                </div> 
            </div>
            
                 <!-- Tarjetas laterales --> 
            <div class="col-md-3"> 
                <div class="card text-center bg-danger text-white mb-3"> 
                    <div class="card-body"> 
                        <h3>Saldo Total</h3> 
                        <h4 class="display-4"> 
                            {{getSaldoTotal() | currency:'MXN':'$'}} 
                        </h4> 
                    </div> 
                </div> 

                <div class="card text-center bg-success text-white mb-3"> 
                    <div class="card-body"> 
                        <h3>Total Clientes</h3> 
                        <h4 class="display-4"> 
                            <i class="bi bi-people-fill"></i> {{clientes?.length}} 
                        </h4> 
                    </div> 
                </div> 
            </div> 
        </div> 
    </div> 
</section>

<!-- Modal para agregar Clientes -->
<div class="modal fade" id="agregarClienteModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <!-- Encabezado del modal -->
             <div class="modal-header bg-info text-white">
                <h5 class="modal-title">Agregar Cliente</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">                    
                </button>
             </div>
             <!-- Formulario para agregar cliente -->
            <form>
                <div class="modal-body">
                    <!-- Campo Nombre -->
                     <div class="d-flex aling-items-center mb-3">
                        <label  for="nombre" class="form-label me-3" style="min-width: 100px;" >
                            Nombre</label>
                         <input type="text" id="nombre" name="nombre"  
                            class="form-control" required />
                     </div>
                </div>
                     <!-- Campo de Apellido --> 
                    <div class="d-flex align-items-center mb-3"> 
                        <label for="apellido" class="form-label me-3"  
                            style="min-width: 100px;">Apellido</label> 
                        <input type="text" id="apellido" name="apellido"  
                            class="form-control" required /> 
                    </div> 
 
                    <!-- Campo de Email --> 
                    <div class="d-flex align-items-center mb-3"> 
                        <label for="email" class="form-label me-3"  
                            style="min-width: 100px;">Email</label> 
                        <input type="email" id="email" name="email"  
                            class="form-control" required /> 
                    </div> 
 
                    <!-- Campo de Saldo --> 
                    <div class="d-flex align-items-center mb-3"> 
                        <label for="saldo" class="form-label me-3"  
                            style="min-width: 100px;">Saldo</label> 
                        <input type="number" id="saldo" name="saldo"  
                            class="form-control" required /> 
                    </div> 

 
                <!-- Footer del modal con el botón de guardar --> 
                <div class="modal-footer"> 
                    <button type="submit" class="btn btn-primary">Guardar</button> 
                </div> 
            </form>


        </div>

    </div>
</div>
